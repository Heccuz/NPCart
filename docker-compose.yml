services:
  db:
    image: postgres:16-alpine
    container_name: npcart-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: npcart
      POSTGRES_PASSWORD: npcart
      POSTGRES_DB: npcart
    ports:
      - '5432:5432'
    volumes:
      - npcart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U npcart -d npcart']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  npcart_pgdata:
