[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npm run db:generate -w backend"

[deploy]
startCommand = "npm run db:deploy -w backend && npm run db:seed -w backend && npm run start -w backend"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
